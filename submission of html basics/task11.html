<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Span Tag Demo</title>
</head>
<body>
    <h2>Categorized Text</h2>
    
    <p>
        We must always ensure the <span class="label-success">accessibility</span> of a website, 
        prioritize <span class="label-primary">user experience</span>, 
        and maintain <span class="label-warning">performance</span> for all users.
    </p>
</body>
</html>
