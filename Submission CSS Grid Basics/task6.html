<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Photo Gallery</title>
    <link rel="stylesheet" href="task6.css">
</head>
<body>
    <header>
        <h1>Creative Photo Gallery</h1>
    </header>

    <main class="gallery">
        
        <div class="gallery-item">
            <img src="img1.jpg" alt="Abstract city architecture">
            <div class="caption">City Lines</div>
        </div>

        <div class="gallery-item">
            <img src="img2.jpg" alt="A quiet forest path">
            <div class="caption">Forest Calm</div>
        </div>
        
        <div class="gallery-item">
            <img src="img3.jpg" alt="Mountain range during sunset">
            <div class="caption">Alpine Sunset</div>
        </div>

        <div class="gallery-item">
            <img src="img4.jpg" alt="Minimalist still life">
            <div class="caption">Stillness</div>
        </div>

        <div class="gallery-item">
            <img src="img5.jpg" alt="Ocean waves crashing">
            <div class="caption">Ocean Spray</div>
        </div>

        <div class="gallery-item">
            <img src="img6.jpg" alt="Street photography with neon signs">
            <div class="caption">Neon Streets</div>
        </div>
        
    </main>
</body>
</html>
